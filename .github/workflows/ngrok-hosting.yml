name: Host Web App via Ngrok

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'How many hours to keep the server alive (Max 6)'
        required: true
        default: '1'

jobs:
  host-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env and ngrok.yml from Secrets
        run: |
          echo "NGROK_AUTHTOKEN=${{ secrets.NGROK_AUTHTOKEN }}" > .env
          echo "version: \"2\"" > ngrok.yml
          echo "tunnels:" >> ngrok.yml
          echo "  webapp:" >> ngrok.yml
          echo "    proto: http" >> ngrok.yml
          echo "    addr: web:8501" >> ngrok.yml
          echo "    domain: ${{ secrets.NGROK_DOMAIN }}" >> ngrok.yml

      - name: Start Docker Compose with Ngrok Profile
        run: docker-compose --profile ngrok up -d

      - name: Wait for Ngrok to initialize
        run: sleep 10

      - name: Display Public URL
        run: |
          echo "=========================================================="
          echo "🌐 YOUR WEB APP IS NOW LIVE!"
          echo "Access it here: https://${{ secrets.NGROK_DOMAIN }}"
          echo "=========================================================="

      - name: Keep Alive
        run: |
          echo "Keeping server alive for ${{ github.event.inputs.duration_hours }} hours..."
          sleep $((${{ github.event.inputs.duration_hours }} * 3600))
